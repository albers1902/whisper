; Whisper — projektets værdier til frameworkets CI og deploy (skabelon: shared/templates/coworker.ini.template).
; KONTROLFIL: en ændring tvinger tier 1 og når først serverne, når ejeren har trykket Publish (bash shared/report.sh ctrl <sha>).
[ci]
php = 8.4                                                   ; projektets PHP på serverne (samme model som chatio)
tests = "${PHP:-php}" homedir/tests/run.php                 ; skriver junit.xml i repoets rod; databasen fra CW_DB_HOST/PORT/NAME/USER/PASS
analyse = homedir/src                                       ; mapper til PHPStan (level 5)

[deploy]
repo = albers1902/whisper
php = /usr/bin/php                                          ; bekræftes som sitets bruger ved serveropsætning (command -v php)
migrate = /usr/bin/php repo/homedir/cron/migrate.php --home=. --dir=repo/homedir/migrations   ; fra hjemmemappen: dens config og database, den nye commits kode og migrationer (også ved første udrulning); ≠ 0 ved fejl

[migrations]
; ingen baseline: projektet startede med frameworket (H001), alle migrationer har headers

[backup]

[health]
dev = https://dev.whisper.xanouso.com/health   ; Whisper har kun DEV og STABLE (intet TEST), samme model som chatio
stable = https://whisper.xanouso.com/health
